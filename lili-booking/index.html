<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F7">
<title>@Li麗 Nail Studio 線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF9F7;--pri:#D87D56;--pri-d:#B9633F;--tint:#FBEDE6;--tx:#2B2523;--line:#E8DFD8;--mut:#7A6D66;--faint:#C4B9B1;--card:#fff;--serif:'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif}
.hero{text-align:center;padding:8px 0 18px}
.hero .crest{width:46px;height:46px;border:1.5px solid var(--pri);border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font:italic 600 22px var(--serif);color:var(--pri)}
.hero .eye{font-size:11px;letter-spacing:.32em;color:var(--pri)}
.hero h1{font:500 24px/1.3 var(--serif);letter-spacing:.12em;margin:6px 0 2px}
.hero .dv{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.hero .dv i{width:36px;height:1px;background:var(--pri);opacity:.6}.hero .dv b{width:5px;height:5px;background:var(--pri);transform:rotate(45deg)}
.hero p{margin:0;font-size:13px;color:var(--mut)}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--serif);letter-spacing:.03em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(251,249,247,.96);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand small{font:500 12px/1 inherit;font-family:inherit;color:var(--pri);letter-spacing:.14em;margin-left:6px}
nav{display:flex;gap:2px;background:#F1E9E3;border-radius:999px;padding:3px}
nav button{font-size:14px;padding:6px 12px;border-radius:999px;color:var(--mut);white-space:nowrap}
nav button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(43,37,35,.08)}
main{padding:16px 0 132px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec h2{font:500 18px/1.3 var(--serif);letter-spacing:.1em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h2 i{font:500 12px/22px var(--serif);font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;text-align:center;flex:none}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
.banner{background:var(--tint);border:1px solid #F0CDBB;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.banner a,.banner button{color:var(--pri-d);font-weight:600;text-decoration:underline}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font:700 16px var(--serif)}
.cal-head button{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--tx)}
.cal-head button:disabled{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:12px;color:var(--mut);text-align:center;padding:2px 0 4px}
.d{position:relative;aspect-ratio:1/1.08;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.1}
.d em{font-style:normal;font-size:12px;line-height:1.2;height:14px}
.d.past{color:var(--faint)}
.d.closed{color:#A2968F;background:repeating-linear-gradient(135deg,#F4EEE9 0 5px,#FBF9F7 5px 10px)}
.d.full{color:var(--mut);background:#F1ECE8}
.d.full em{color:var(--mut);font-weight:600}
.d.open{font-weight:700;background:#fff;border:1px solid var(--line)}
.d.open em::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pri)}
.d.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.d.sel em::before{background:#fff}
.d.today::after{content:'今';position:absolute;top:2px;right:4px;font-size:10px;font-weight:400;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:16px;height:16px;border-radius:4px;display:inline-block;font:600 11px/16px sans-serif;text-align:center}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:#fff;min-height:60px}
.slot b{display:block;font-size:17px}
.slot span{font-size:12px;color:var(--mut)}
.slot.on{background:var(--pri);border-color:var(--pri);color:#fff}
.slot.on span{color:#fff}
.slot:disabled{background:#F1ECE8;color:var(--faint);cursor:default}
.slot:disabled span{color:var(--mut)}
.slot.other{grid-column:1/-1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-style:dashed;border-color:var(--pri);background:#FBF6F2}
.slot.other.on{border-style:solid;background:var(--pri)}
.trow{display:flex;align-items:flex-end;gap:8px}.trow label{flex:1}.trow span{padding-bottom:12px;color:var(--mut)}
.slot.other b{display:block;font-size:16px;color:var(--pri)}
.slot.other.on b{color:#fff}
.d.full[data-act]{cursor:pointer;border:1px dashed var(--line)}
.custom{margin-top:10px;padding:12px;border:1px dashed #E3B9A5;border-radius:12px;background:var(--tint)}
.custom input{max-width:160px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#FDF0D9;color:#9A6512;margin-left:6px;vertical-align:middle}
/* services */
.grp{font-size:13px;color:var(--mut);letter-spacing:.08em;margin:14px 0 6px}
.grp:first-of-type{margin-top:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;background:#fff;min-height:48px}
.opt .n{flex:1}
.opt .p{font-weight:500;white-space:nowrap}
.opt::before{content:'';flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint)}
.opt.on{border-color:var(--pri);background:var(--tint)}
.opt.on::before{border:5px solid var(--pri)}
.step{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.step small{display:block;font-size:13px;color:var(--mut)}
.step .ctl{display:flex;align-items:center;gap:4px}
.step .ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1;background:#fff}
.step .ctl button:disabled{color:var(--faint)}
.step .ctl b{min-width:34px;text-align:center;font-size:17px}
label.f{display:block;font-size:14px;color:var(--mut);margin-top:12px}
label.f:first-of-type{margin-top:0}
input[type=text],input[type=tel],input[type=date],textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{min-height:72px;resize:vertical}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:14px}
.agree input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
ul.notes{margin:0;padding-left:18px;font-size:13px;color:var(--mut)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
#bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
#bar .sum small{display:block;font-size:12px;color:var(--mut)}
#bar .sum b{font:700 20px/1.2 var(--serif)}
#bar .sum b.none{font:400 14px sans-serif;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--pri);color:#fff;font-weight:600;letter-spacing:.12em;font-size:16px;white-space:nowrap}
.btn:active{background:var(--pri-d)}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.block{display:flex;width:100%;margin-top:10px}
/* cards */
.bk h3{font:700 18px var(--serif);margin:0 0 2px}
.kv{display:flex;gap:12px;font-size:15px;padding:3px 0}
.kv span{color:var(--mut);width:72px;flex:none;font-size:14px}
.kv b{font-weight:600}
.row-btn{display:flex;gap:8px;margin-top:12px}
.row-btn .btn{flex:1}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.li:last-child{border:0}
.center{text-align:center;padding:48px 16px;color:var(--mut)}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--pri);color:#fff;font-size:34px;line-height:64px;margin:8px auto 12px;text-align:center}
.done h1{font:700 24px var(--serif);text-align:center;margin:0 0 4px}
.done p{text-align:center;color:var(--mut);font-size:14px;margin:0 0 16px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;z-index:9;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(43,37,35,.45);z-index:8;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}
#modal h3{font:700 18px var(--serif);margin:0 0 6px}
#modal p{margin:0 0 6px;color:var(--mut);font-size:14px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Li麗<small>NAIL STUDIO</small></div>
  <nav id="tabs"></nav>
</div></header>
<main><div class="wrap" id="app"><div class="center"><div class="spin"></div>載入中…</div></div></main>
<div id="bar" hidden><div class="wrap"><div class="sum" id="sum"></div><button class="btn" id="submit" data-act="submit"></button></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script>
(function () {
'use strict';
var Q = new URLSearchParams(location.search);
var DEMO = Q.has('demo');
var S = { view: 'loading', mode: 'new', sel: { main: null, patch: 0, extend: 0, removal: 'none' }, days: {}, bookings: [], busy: false };
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var num = function (n) { return Number(n).toLocaleString('en-US'); };
var price = function (a, b) { return 'NT$' + num(a) + (b > a ? '–' + num(b) : ''); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var ymd = function (y, m, d) { return y + '-' + pad(m) + '-' + pad(d); };
var dlabel = function (s) { var p = s.split('-'); return +p[1] + '/' + +p[2] + '（' + '日一二三四五六'.charAt(new Date(+p[0], p[1] - 1, +p[2]).getDay()) + '）'; };

function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 3200); }
function modal(html) { $('toast').classList.remove('on'); $('modalBox').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }

// ───────── API ─────────
function api(action, data) {
  if (DEMO) return demoApi(action, data || {});
  var body = Object.assign({ action: action, idToken: S.token }, data || {});
  return fetch(window.LILI.GAS_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .catch(function () { throw new Error('連線失敗，請檢查網路後再試一次'); })
    .then(function (j) { if (!j.ok) { var e = new Error(j.message || '發生錯誤'); e.code = j.error; throw e; } return j; });
}
function setDays(list) { S.days = {}; (list || []).forEach(function (d) { S.days[d.date] = d; }); }

// ───────── 啟動 ─────────
function params() {
  var p = new URLSearchParams(location.search), st = p.get('liff.state');
  if (st) new URLSearchParams(st.replace(/^[/?]+/, '')).forEach(function (v, k) { p.set(k, v); });
  return p;
}
function start() {
  var boot;
  if (DEMO) boot = Promise.resolve();
  else {
    if (!window.liff || !window.LILI || !/^\d+-\w+$/.test(window.LILI.LIFF_ID)) return fatal('尚未完成設定', '請在 config.js 填入 LIFF ID 與 Web App 網址。想先看畫面，可在網址後面加上 ?demo=1');
    boot = liff.init({ liffId: window.LILI.LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
      var dec = liff.getDecodedIDToken();
      if (dec && dec.exp * 1000 < Date.now() + 60000 && !sessionStorage.getItem('relogin')) { // token 過期 → 重新登入一次
        sessionStorage.setItem('relogin', '1'); liff.logout(); location.reload(); return new Promise(function () {});
      }
      sessionStorage.removeItem('relogin');
      S.token = liff.getIDToken();
    });
  }
  boot.then(function () {
    var p = params();
    S.want = { view: p.get('view'), mode: p.get('mode'), id: p.get('id') };
    return api('init', { admin: S.want.view === 'adminbook' });
  }).then(function (r) {
    S.cfg = r.config; S.user = r.user; S.bookings = r.bookings; setDays(r.days);
    S.month = S.cfg.today.substr(0, 7);
    S.name = S.user.name || '';
    var w = S.want;
    if (w.mode === 'reschedule' && w.id) { var b = S.bookings.filter(function (x) { return x.id === w.id; })[0]; if (b) return startReschedule(b); go('mine'); return toast('找不到這筆預約，可能已取消'); }
    if (S.user.isOwner && w.view === 'lock') return go('lock');
    if (S.user.isOwner && w.view === 'adminbook') { S.mode = 'admin'; return go('book'); }
    go(w.view === 'mine' ? 'mine' : 'book');
    checkFriend();
  }).catch(function (e) { fatal('無法載入預約頁', e.message || '請稍後再試'); });
}
function fatal(title, msg) { $('bar').hidden = true; $('app').innerHTML = '<div class="center"><b style="color:var(--tx);font-size:18px">' + esc(title) + '</b><p>' + esc(msg) + '</p></div>'; }
function checkFriend() {
  if (DEMO || !S.cfg.oaUrl || !liff.getFriendship) return;
  liff.getFriendship().then(function (f) {
    if (!f.friendFlag) $('app').insertAdjacentHTML('afterbegin', '<div class="banner">請先加入官方帳號，才收得到預約確認與提醒。<a href="' + esc(S.cfg.oaUrl) + '">加入好友</a></div>');
  }).catch(function () {});
}

// ───────── 畫面切換 ─────────
function go(view) {
  S.view = view;
  $('toast').classList.remove('on');
  window.scrollTo(0, 0);
  var tabs = [['book', '預約'], ['mine', '我的預約']];
  if (S.user && S.user.isOwner) tabs.push(['admin', '店長']);
  var cur = view === 'lock' ? 'admin' : (view === 'done' ? 'book' : view);
  if (S.mode === 'admin' && view === 'book') cur = 'admin';
  document.querySelector('.brand small').hidden = tabs.length > 2;
  $('tabs').innerHTML = tabs.map(function (t) { return '<button data-act="tab" data-v="' + t[0] + '" class="' + (t[0] === cur ? 'on' : '') + '">' + t[1] + '</button>'; }).join('');
  $('bar').hidden = view !== 'book';
  ({ book: renderBook, mine: renderMine, admin: renderAdmin, lock: renderLock, done: renderDone })[view]();
}

// ───────── 預約頁 ─────────
function renderBook() {
  var res = S.mode === 'reschedule', adm = S.mode === 'admin', h = '';
  if (res) h += '<div class="banner">正在改期：<b>' + esc(S.res.dateLabel + ' ' + S.res.slot) + '</b>｜' + esc(S.res.main) + '<br>請選擇新的日期與時段。<button data-act="cancelRes">放棄改期</button></div>';
  if (adm) h += '<div class="banner">店長手動新增預約（不受 12 小時限制，不會傳訊息給客人）。<button data-act="exitAdmin">返回</button></div>';
  if (!res && !adm) h += '<div class="hero"><div class="crest">L</div><div class="eye">PRIVATE NAIL ATELIER</div><h1>預約專屬美甲時光</h1><div class="dv"><i></i><b></b><i></i></div><p>全項目皆含基礎指緣護理・每場約 2 小時</p></div>';
  h += '<section class="sec"><h2><i>1</i>選擇日期與時段</h2><div id="cal"></div><div id="slots"></div></section>';
  if (!res) {
    h += '<section class="sec" id="secSvc"><h2><i>2</i>選擇服務</h2><div id="svc"></div><p class="hint">全項目皆含基礎指緣護理。</p></section>';
    h += '<section class="sec"><h2><i>3</i>加購與卸甲</h2><div id="add"></div></section>';
    h += '<section class="sec" id="secInfo"><h2><i>4</i>' + (adm ? '顧客資料' : '聯絡資料') + '</h2>' +
      '<label class="f">姓名（必填）<input type="text" id="fName" maxlength="30" autocomplete="name" value="' + esc(adm ? '' : S.name) + '"></label>' +
      '<label class="f">手機號碼（必填）<input type="tel" id="fPhone" inputmode="tel" maxlength="14" autocomplete="tel" placeholder="0912345678" value="' + esc(adm ? '' : (S.phone || '')) + '"></label>' +
      '<label class="f">備註（選填）<textarea id="fNote" maxlength="200" placeholder="例：延甲、指甲狀況、特殊需求"></textarea></label>' +
      (adm ? '' : '<p class="hint">想讓我們先看參考圖，預約後直接傳到聊天室就可以。</p><label class="agree"><input type="checkbox" id="fAgree"><span>' + esc(S.cfg.privacy) + '</span></label>') +
      '</section>';
    h += '<section class="sec"><h2>預約須知</h2><ul class="notes">' + S.cfg.notices.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></section>';
  }
  $('app').innerHTML = h;
  drawCal(); drawSlots();
  if (!res) { drawSvc(); drawAdd(); }
  drawBar();
}

function drawCal() {
  var y = +S.month.substr(0, 4), m = +S.month.substr(5, 2), today = S.cfg.today;
  var keys = Object.keys(S.days).sort(), firstM = today.substr(0, 7), lastM = (keys[keys.length - 1] || today).substr(0, 7);
  var h = '<div class="cal-head"><button data-act="mon" data-d="-1" aria-label="上個月"' + (S.month <= firstM ? ' disabled' : '') + '>‹</button><b>' + y + ' 年 ' + m + ' 月</b>' +
    '<button data-act="mon" data-d="1" aria-label="下個月"' + (S.month >= lastM ? ' disabled' : '') + '>›</button></div><div class="grid">';
  '一二三四五六日'.split('').forEach(function (w) { h += '<div class="wd">' + w + '</div>'; });
  var off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  for (var i = 0; i < off; i++) h += '<div></div>';
  for (var d = 1; d <= n; d++) {
    var ds = ymd(y, m, d), info = S.days[ds], st = info ? info.status : 'past';
    var cls = 'd ' + st + (ds === S.date ? ' sel' : '') + (ds === today ? ' today' : '');
    var tag = st === 'closed' ? '休' : st === 'full' ? '滿' : '';
    var canCustom = st === 'full' && S.cfg.custom && S.cfg.custom.enabled && S.mode !== 'reschedule';
    if (st === 'open') h += '<button class="' + cls + '" data-act="date" data-d="' + ds + '" aria-label="' + dlabel(ds) + ' 可預約">' + d + '<em></em></button>';

      else {
        cfg.slots.forEach(function (s, j) {
          var taken = (i * 7 + j * 3) % 5 < (i < 10 ? 3 : 1) || demo.bookings.some(function (b) { return b.date === ds && b.slotId === s.id; }) || demo.locks.locks.some(function (l) { return l.date === ds && l.slotId === s.id; });
          var late = i === 0;
          day.slots.push({ id: s.id, label: s.label, available: !taken && !late, reason: taken ? 'booked' : late ? 'late' : '' });
        });
        if (!day.slots.some(function (s) { return s.available; })) day.status = i === 0 ? 'past' : 'full';
      }
      out.push(day);
    }
    return out;
  };
  var mk = function () {
    var c = cfg.catalog, m, add = [], ex = 0;
    c.main.forEach(function (g) { g.items.forEach(function (it) { if (it.id === d.sel.main) m = it; }); });
    c.perFinger.forEach(function (p) { if (d.sel[p.id]) { ex += d.sel[p.id] * p.price; add.push(p.name + '×' + d.sel[p.id] + '指'); } });
    c.removal.forEach(function (r) { if (r.id === d.sel.removal && r.price) { ex += r.price; add.push(r.name); } });
    return { id: 'LL' + d.date.substr(5, 2) + d.date.substr(8, 2) + '-DEM', date: d.date, dateLabel: dlabel(d.date), slotId: d.slotId, slot: d.slotId === 'CUSTOM' ? d.customTime + '-' + d.customEnd : cfg.slots.filter(function (s) { return s.id === d.slotId; })[0].label, pending: d.slotId === 'CUSTOM' && !d.admin,
      main: m.name, addons: add.join('、'), price: m.min + ex, priceMax: m.max + ex, priceText: price(m.min + ex, m.max + ex), status: '已預約' };
  };
  var locks = function () { return { holidays: demo.locks.holidays, locks: demo.locks.locks }; };
  var r = { ok: true };
  if (action === 'init') { r.config = cfg; r.user = { name: '王小美', isOwner: Q.get('demo') === 'owner' }; r.days = days(); r.bookings = demo.bookings; }
  else if (action === 'availability') r.days = days();
  else if (action === 'book') { r.booking = mk(); if (!d.admin) demo.bookings.push(r.booking); }
  else if (action === 'cancel') { r.booking = byId(d.id); demo.bookings = demo.bookings.filter(function (b) { return b.id !== d.id; }); r.bookings = demo.bookings; }
  else if (action === 'reschedule') { var b = demo.bookings.filter(function (x) { return x.id === d.id; })[0]; b.date = d.date; b.dateLabel = dlabel(d.date); b.slotId = d.slotId; b.slot = cfg.slots.filter(function (s) { return s.id === d.slotId; })[0].label; r.booking = b; r.bookings = demo.bookings; }
  else if (action === 'locks') r.locks = locks();
  else if (action === 'addLock') { if (d.slotId === 'ALL') demo.locks.holidays.push({ date: d.date, dateLabel: dlabel(d.date) }); else demo.locks.locks.push({ date: d.date, dateLabel: dlabel(d.date), slotId: d.slotId, slot: cfg.slots.filter(function (s) { return s.id === d.slotId; })[0].label, note: d.note }); r.locks = locks(); r.days = days(); }
  else if (action === 'removeLock') { if (d.slotId === 'ALL') demo.locks.holidays = demo.locks.holidays.filter(function (h) { return h.date !== d.date; }); else demo.locks.locks = demo.locks.locks.filter(function (l) { return !(l.date === d.date && l.slotId === d.slotId); }); r.locks = locks(); r.days = days(); }
  return new Promise(function (res) { setTimeout(function () { res(JSON.parse(JSON.stringify(r))); }, 250); });
}

start();
})();
</script>
